[project]
name = "leechbot"
version = "3.1.9"
description = "Advanced Telegram File Transloader"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shinei Nouzen", email = "157171073+Shineii86@users.noreply.github.com"},
]
homepage = "https://github.com/Shineii86/LeechBot"
repository = "https://github.com/Shineii86/LeechBot"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["leechbot", "config"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
